{% extends "base.html" %}
{% block title %}历史记录 · {{ app_name }}{% endblock %}
{% block page %}history{% endblock %}

{% block body %}
<main class="page-wrap">
  <div id="pageBody">
    <div class="page-head">
      <div>
        <h1>历史记录</h1>
        <p class="sub">这里只展示你自己的会话记录，其他用户（包括管理员）无法查看</p>
      </div>
      <div class="page-actions">
        <input class="form-control form-control-sm" id="searchInput" style="width:220px" placeholder="按标题搜索…">
        <button class="btn btn-outline-secondary btn-sm" id="refreshBtn" type="button">
          <i class="bi bi-arrow-clockwise me-1"></i>刷新
        </button>
        <a class="btn btn-primary btn-sm" href="/chat"><i class="bi bi-plus-lg me-1"></i>新建咨询</a>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th style="width:44%">会话标题</th>
              <th style="width:12%">消息数</th>
              <th style="width:24%">创建时间</th>
              <th style="width:20%" class="text-end">操作</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
      <div id="historyState"></div>
    </div>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script src="/static/js/history.js"></script>
{% endblock %}
