<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body data-page="{% block page %}{% endblock %}">
  {% block navbar %}
  <nav class="app-navbar">
    <a class="brand" href="/chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        <path d="M8 9h8M8 13h5"></path>
      </svg>
      <span>{{ app_name }}</span>
    </a>
    <div class="nav-links">
      <a class="nav-link" data-page="chat" href="/chat">客服问答</a>
      <a class="nav-link" data-page="history" href="/history">历史记录</a>
      <a class="nav-link hidden" data-page="documents" data-role="admin" href="/documents">知识库管理</a>
      <a class="nav-link hidden" data-page="admin" data-role="admin" href="/admin">用户管理</a>
    </div>
    <div class="nav-right">
      <div id="navGuest" class="d-flex gap-2">
        <a class="btn btn-outline-secondary btn-sm" href="/login">登录</a>
        <a class="btn btn-primary btn-sm" href="/register">注册</a>
      </div>
      <div id="navUserArea" class="dropdown hidden">
        <button class="nav-user-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle"></i>
          <span id="navUserName"></span>
          <i class="bi bi-chevron-down" style="font-size:11px"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="/history"><i class="bi bi-clock-history me-2"></i>历史记录</a></li>
          <li><a class="dropdown-item" href="#" data-action="logout"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
        </ul>
      </div>
    </div>
  </nav>
  {% endblock %}

  {% block body %}
  <main class="page-wrap">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}

  <div class="toast-stack" id="toastStack"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/auth.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
